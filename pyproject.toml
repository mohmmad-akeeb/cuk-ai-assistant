[project]
name = "cuk-assistant"
version = "0.1.0"
description = "CUK RAG chatbot — scraper, ingestion pipeline, retrieval, and chat API"
readme = "README.md"
authors = [
    { name = "mohmmad-akeeb", email = "mohammadakeeb786@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # HTTP + scraping
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    # CLI + display
    "typer>=0.27.3",
    "rich>=15.0.0",
    # Data
    "pandas>=3.1.0",
    "pydantic>=2.14.3",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "lancedb>=0.41.0",
    "fastembed>=0.9.1",
    "flashrank>=0.2.10",
    "pyarrow>=26.0.1",
    "tantivy>=0.27.0",
    "chainlit>=2.12.0",
    "pydantic-logfire>=0.0.1",
    "logfire[httpx,pydantic]>=5.6.0",
]

[project.scripts]
cuk-crawl = "cuk_assistant.ingestion.cli.crawl:app"
cuk-explore = "cuk_assistant.ingestion.cli.crawl:app"
cuk-parse = "cuk_assistant.ingestion.cli.parse:app"
cuk-ingest = "cuk_assistant.ingestion.cli.ingest:app"
cuk-index = "cuk_assistant.ingestion.cli.index:app"
cuk-ui = "cuk_assistant.ui.app:run"
cuk-eval = "cuk_assistant.evals.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""          # package root is repo root (no src/ wrapper)

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: mark test as integration test",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
